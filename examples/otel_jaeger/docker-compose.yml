# A self-hosted trace backend in one container. UI: http://localhost:16686
services:
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686" # web UI and query API
      - "127.0.0.1:4318:4318"   # OTLP over HTTP
